services:

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - flask-api-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: haproxy
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
    depends_on:
      haproxy:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - flask-api-network

  haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy
    networks:
      - flask-api-network

  db1:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flask-api-network

  db2:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flask-api-network

  bucardo:
    build:
      context: ./bucardo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy
    networks:
      - flask-api-network

networks:
  flask-api-network:
    name: flask-api-network

volumes:
  postgres_data1:
  postgres_data2:
